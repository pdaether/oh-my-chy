# oh-my-chy extra tmux settings
# Appended to Omarchy's managed ~/.config/tmux/tmux.conf as a marked block.
# Note: prefix is C-Space (Omarchy default). The resize bindings below override
# Omarchy's prefix+h/l split bindings on purpose (old muscle memory).

set -g mouse on
set -g history-limit 50000
set -g display-time 4000
set -g status-interval 5
set -g renumber-windows on
set -g status-position top

# Reload config
bind -N "Reload configuration" r source-file ~/.config/tmux/tmux.conf \; display "Configuration reloaded"

# Resize panes (repeatable)
bind -r k resize-pane -U 5
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r l resize-pane -R 5

# Copy selection to system clipboard (Wayland)
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"

# Popups
bind C-t display-popup -d "#{pane_current_path}" -E "bash"
bind C-f display-popup -d "#{pane_current_path}" -w 90% -h 90% -E "yazi"
